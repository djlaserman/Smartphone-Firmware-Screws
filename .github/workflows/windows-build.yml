name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHON_VERSION: "3.11"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Determine build version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = "1.0.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid generated version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Apply build version
        shell: pwsh
        run: python scripts/update_version.py "$env:APP_VERSION"

      - name: Compile Python source
        shell: pwsh
        run: python -m py_compile src/smartphone_firmware_screws.py

      - name: Build Windows executable
        shell: pwsh
        run: >-
          pyinstaller
          --clean
          --noconfirm
          --onefile
          --windowed
          --name SmartphoneFirmwareScrews
          --add-data "src/tools;tools"
          --add-data "src/config;config"
          src/smartphone_firmware_screws.py

      - name: Create release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/SmartphoneFirmwareScrews.exe "release/SmartphoneFirmwareScrews-$env:APP_VERSION-windows-x64.exe"
          Set-Content -Path release/VERSION.txt -Value $env:APP_VERSION
          Get-FileHash release/* -Algorithm SHA256 | Format-Table | Out-File release/SHA256SUMS.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartphoneFirmwareScrews-windows-${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true